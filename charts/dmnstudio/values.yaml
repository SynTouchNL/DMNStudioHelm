# TODO:
#  - Move hostnames to global (DMN Studio, Keycloak)
#  - Split resources per frontend/backend

global:
  image:
    repository: ghcr.io/syntouchnl

image:
  pullPolicy: IfNotPresent

imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

backend:
  replicaCount: 1

  image:
    # Only override if you want to override global
    repository:
    name: dmn-studio-backend
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest-native"
  config:
    secretfile: "dmnstudiosecrets"
    # Database Configuration
    QUARKUS_DATASOURCE_JDBC_URL: #jdbc:postgresql://postgres-dmn-studio:5432/dmn-studio
    QUARKUS_DATASOURCE_USERNAME:

    # Keycloak OIDC Configuration
    QUARKUS_OIDC_CLIENT_ID:
    QUARKUS_REST_CLIENT_KEYCLOAK_API_REALM: dmn_studio

    # Operaton REST API Configuration
    #QUARKUS_REST_CLIENT_OPERATON_REST_API_JSON_URL: #http://operaton:8085/engine-rest
    QUARKUS_REST_CLIENT_OPERATON_REST_API_TEST_URL: operaton.dmn.studio
    QUARKUS_REST_CLIENT_OPERATON_REST_API_UT_URL: operaton.dmn.studio
    QUARKUS_REST_CLIENT_OPERATON_REST_API_ACC_URL: operaton.dmn.studio
    QUARKUS_REST_CLIENT_OPERATON_REST_API_PROD_URL: operaton.dmn.studio
    QUARKUS_OPENAPI_GENERATOR_OPERATON_REST_API_JSON_AUTH_BASICAUTH_USERNAME: demo

    # Keycloak Admin API Configuration
    QUARKUS_REST_CLIENT_KEYCLOAK_API_URL: #http://keycloak:8181

  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  service:
    type: ClusterIP
    port: 8080

  livenessProbe:
    httpGet:
      path: /api/q/health/live
      port: 8080
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /api/q/health/ready
      port: 8080
    periodSeconds: 10

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  volumes: []
    # - name: foo
    #   secret:
    #     secretName: mysecret
    #     optional: false

  volumeMounts: []
    # - name: foo
    #   mountPath: "/etc/foo"
    #   readOnly: true

frontend:
  replicaCount: 1

  image:
    # Only override if you want to override global
    repository:
    name: dmn-studio-frontend
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"

  config:
    DMNSTUDIO_URL: https://dmnstudio.dmn.studio/
    DMNSTUDIO_KEYCLOAK_URL: https://keycloak.dmn.studio/
    DMNSTUDIO_KEYCLOAK_REALM: dmn_studio
    DMNSTUDIO_KEYCLOAK_CLIENT_ID: angular-frontend
    DMNSTUDIO_QUARKUS_URL: https://dmnstudio.dmn.studio/api

  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  service:
    type: ClusterIP
    port: 8080

  livenessProbe:
    httpGet:
      path: /
      port: 8080
    #initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /
      port: 8080
    #initialDelaySeconds: 5
    periodSeconds: 10

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # Additional volumes on the output Deployment definition.
  #extraVolumes:
  #  - name: nginxconf
  #    configMap:
  #      # Provide the name of the ConfigMap containing the files you want
  #      # to add to the container
  #      name: nginxconf

  # Additional volumeMounts on the output Deployment definition.
  #extraVolumeMounts:
  #  - name: nginxconf
  #    mountPath: "/etc/nginx/nginx.conf"
  #    subPath: nginx.conf
  #    readOnly: true

### Config for FE & BE together
#syncAKV:
#  dmnstudiosecrets:
#    vaultname: myvault
#    objectname: mysecret
#    objecttype: multi-key-value-secret
#    contenttype: application/x-yaml
#    output:
#      secret:
#        name: "dmnstudio"

ingress:
  enabled: true
  className: "nginx"
  annotations:

  hosts:
    - host: dmnstudio.dmn.studio
      paths:
        - path: /
          servicesuffix: frontend
          pathType: Prefix
          port: 8080
        - path: /api
          servicesuffix: backend
          pathType: Prefix
          port: 8080
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# TODO: Configure HTTPRoute rules for the frontend and backend.
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
    - chart-example.local
  # List of rules and filters applied.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      servicesuffix: backend
      port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      servicesuffix: frontend
      port: 8080
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

nodeSelector: {}
tolerations: []
affinity: {}

testoperaton:
  enabled: true

  image:
    repository: ghcr.io/syntouchnl/dmn-operaton-helm
    tag: latest
    pullPolicy: Always
    #    pullSecrets: []
    command: ["./operaton.sh"]
    args: ["--webapps", "--rest", "--oauth2", "--production"]

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL

  extraEnvs:
    - name: OPERATON_BPM_RUN_EXAMPLE_ENABLED
      value: "false"
    - name: OPERATON_HOST_URL
      value: "https://operaton.dmn.studio"
    - name: OPERATON_KEYCLOAK_HOST
      value: "https://keycloak.dmn.studio/"
    - name: OPERATON_KEYCLOAK_REALM
      value: dmn_studio
    - name: OPERATON_KEYCLOAK_CLIENT_ID
      value: ""
    - name: OPERATON_KEYCLOAK_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: dmnstudiosecrets
          key: OPERATON_KEYCLOAK_CLIENT_SECRET

  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    hosts:
      - host: operaton.dmn.studio
        paths:
          - /
    tls: []
    #  - secretName: operaton-tls
    #    hosts:
    #      - operaton.local
